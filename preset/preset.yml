name: 字节保真编辑器（BOM/CRLF）
description: dsh 自带 preset 的副本，额外挂载 edit_text / write_text 两个文本编辑工具：保 UTF-8 BOM 与文件自身 CRLF/LF 风格、忽略空白匹配（空格/空行/换行都忽略，字符不同即拒写并点名第一处）、支持 grep/lines 锚点；结果只回一行统计（不回显改动内容，也不回显路径），不在工作区留下任何旁路文件；read-only 会话下拒写（镜像宿主文件策略）。纯 Node 进程内实现（零依赖、不启动任何外部进程）
